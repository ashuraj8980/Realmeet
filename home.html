        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.1); } 100% { transform: scale(1); } }

        .scroller { display: flex; gap: 24px; animation: scroll 50s linear infinite; width: max-content; }
        @keyframes scroll { from { transform: translateX(0); } to { transform: translateX(-50%); } }

        /* Chora (Wide) Notification Toast */
        #notify-toast {

                revs += `<div class="bg-slate-900/60 p-5 rounded-2xl border border-white/5 min-w-[240px]">

        function startNotifications() {
            setInterval(() => {

                document.getElementById('notif-msg').innerText = msg;
                const toast = document.getElementById('notify-toast');
                toast.classList.add('toast-active');
                setTimeout(() => toast.classList.remove('toast-active'), 5000);
            }, 12000);
        }

        function filterByArea() {
            let input = document.getElementById('areaSearch').value.toLowerCase();
            let cards = document.getElementsByClassName('card-inner');
            for(let i=0; i<cards.length; i++) {
                cards[i].parentElement.style.display = cards[i].innerText.toLowerCase().includes(input) ? "block" : "none";
            }
        }

        function viewDetails(name, city, img, age, rate) {
            localStorage.setItem('selectedProfile', JSON.stringify({name, city, img, age, rate}));
            window.location.href = 'profile.html';
